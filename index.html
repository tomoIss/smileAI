<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>リアルタイム笑顔検出 (ONNX Runtime Web)</title>
  <link rel="stylesheet" href="style.css" />
  <!-- ONNX Runtime Web (WASM軽量版バンドル) -->
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.23.2/dist/ort.wasm.min.js"></script>
</head>
<body>
  <main class="container">
    <header>
      <h1>Smile Detector</h1>
      <p id="status" class="status">初期化中...</p>
    </header>

    <section class="stage-wrapper">
      <div id="stage" class="stage mirrored">
        <video id="video" playsinline muted autoplay></video>
        <canvas id="overlay"></canvas>
      </div>
    </section>

    <section class="controls">
      <div class="btn-row">
        <button id="toggleCameraBtn" disabled>カメラ開始</button>
        <button id="switchFacingBtn" disabled>カメラ切替 (前面/背面)</button>
      </div>

      <div class="slider-row">
        <label for="thresholdSlider">
          笑顔判定しきい値: <strong id="thresholdValue">0.50</strong>
        </label>
        <input id="thresholdSlider" type="range" min="0.10" max="0.95" step="0.05" value="0.50" />
      </div>

      <div class="metrics">
        <span id="metricsText">FPS: -- | 推論時間: -- ms</span>
      </div>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
